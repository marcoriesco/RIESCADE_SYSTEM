<div data-riescade-view="gamelist">
  <link rel="stylesheet" href="./assets/css/styles.css" />

  <!-- Camadas de Fundo -->
  <div class="gamelist-bg-layer gamelist-bg-default"></div>
  <img
    class="gamelist-bg-layer gamelist-fanart"
    src="{game:fanart}"
    onerror="this.src = '{game:image}'"
  />
  <div class="gamelist-bg-layer gamelist-overlay"></div>

  <!-- Camada Principal -->
  <div class="gamelist-ui">
    <!-- Header Global -->
    <div class="riescade-header">
      <div class="header-left">
        <div class="system-name">{system:fullName}</div>
      </div>
      <div class="header-center centered">
        <div class="clock">{global:time}</div>
      </div>
      <div class="header-right"></div>
    </div>

    <!-- Conteúdo da Gamelist -->
    <div class="gamelist-main-content">
      <!-- Coluna Esquerda: Thumbnail e Metadados -->
      <div class="gamelist-left-col">
        <div class="thumbnail-container">
          <img
            src="{game:thumbnail}"
            class="gamelist-thumbnail"
            onerror="this.src = './assets/logos/{system:theme}.png'"
          />
        </div>

        <div class="gamelist-game-info">
          <h2 class="gamelist-game-title">{game:name}</h2>
          <div class="gamelist-game-meta">
            {game:releasedate:d/m/Y}, {game:developer}
          </div>
        </div>
      </div>

      <!-- Coluna Direita: Carousel Vertical -->
      <div class="gamelist-right-col">
        <riescade-game-carousel
          direction="vertical"
          media-source="marquee"
          items-count="11"
          logo-scale="0.6"
          logo-selected-scale="1.5"
        ></riescade-game-carousel>
      </div>
    </div>

    <!-- Footer Global -->
    <div class="riescade-footer">
      <div class="system-meta">
        <span class="system-theme-text"
          >{system:theme}
          <span class="hardware-type">[{system:hardwareType}]</span></span
        >
      </div>

      <!-- Helpsystem Customizado do Origins -->
      <div class="helpsystem-bar centered">
        <img
          src="./assets/_parts/helpsystem/gamelist-ps4.png"
          class="helpsystem-image"
        />
      </div>

      <div class="controller-activity">
        <img src="./assets/indicators/ps4.svg" class="controller-icon" />
      </div>
    </div>
  </div>
</div>
