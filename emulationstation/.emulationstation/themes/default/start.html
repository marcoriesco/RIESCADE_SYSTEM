<link rel="stylesheet" href="./assets/css/styles.css" />

<div class="intro-screen" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: linear-gradient(to right, #ff0080, #7928ca); display: flex; align-items: center; justify-content: center; overflow: hidden; font-family: sans-serif;">
  <!-- Simple CSS Loader -->
  <div class="intro-loader">
      <div style="width: 30%; height: 100%; background: #fff; animation: loading-bar 2s infinite ease-in-out;"></div>
  </div>

  <!-- Splash Image -->
  <img src="./assets/_parts/splash.png" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover;" />

  <!-- Loading Message Container -->
  <div style="position: absolute; bottom: 5%; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 10px;">
    <span style="color: #fff; text-transform: uppercase; letter-spacing: 5px; font-size: 1.2rem; font-weight: 700; text-shadow: 0 4px 10px rgba(0,0,0,0.5);">Carregando plataformas...</span> 
  </div>

  <style>
    @keyframes loading-bar {
      0% { transform: translateX(-100%); width: 20%; }
      50% { width: 50%; }
      100% { transform: translateX(500%); width: 20%; }
    }
  </style>

</div>
