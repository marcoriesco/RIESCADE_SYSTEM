<!-- 
  ==============================================================
  RIESCADE THEME ENGINE - MENU VIEW (menu.html)
  Este é o layout base em volta da lista de itens do menu.
  ==============================================================
-->
<div
	data-riescade-view="menu"
	style="
		width: 100vw;
		height: 100vh;
		display: flex;
		align-items: center;
		justify-content: center;
		position: relative;
		--theme-color: {options:colors};
	"
>
	<!-- 1. Arquivos de Estilo Separados -->
	<link href="./assets/css/global.css" rel="stylesheet" />
	<link href="./assets/css/menu.css" rel="stylesheet" />

	<!-- 2. Plano de fundo animado via tag customizada (opcional) -->
	<!-- <riescade-video src="./assets/videos/menu_bg.mp4" fallback="./assets/images/menu_bg.png" style="position:absolute; top:0; left:0; width:100%; height:100%; z-index:0; opacity:0.3;"></riescade-video> -->

	<!-- 3. Camada de Blur -->
	<div class="menu-overlay-backdrop"></div>

	<!-- 4. Caixa/Container Central -->
	<div class="menu-custom-container">
		<!-- HEADER -->
		<div class="menu-header">
			<img
				src="./assets/indicators/ps4.svg"
				style="width: 24px; height: 24px; opacity: 0.8"
			/>

			<!-- VARIÁVEL: {menuTitle} muda automaticamente de acordo com o submenu aberto -->
			<h2>{menuTitle}</h2>
		</div>

		<!-- 5. TAG MANDATÓRIA: Aqui é onde as opções/botões reais do React são carregados -->
		<div class="menu-items-container">
			<riescade-menu-items></riescade-menu-items>
		</div>

		<!-- FOOTER -->
		<div class="menu-footer">
			<div class="help-buttons">
				<div class="help-btn"><span class="help-icon">A</span> SELECIONAR</div>
				<div class="help-btn"><span class="help-icon">B</span> VOLTAR</div>
			</div>

			<!-- VARIÁVEIS: Mostrando o horário do sistema dinamicamente -->
			<div style="display: flex; gap: 15px; align-items: center">
				<span>RIESCADE</span>
				<span style="color: #ffffff">{global:time}</span>
			</div>
		</div>
	</div>
</div>
