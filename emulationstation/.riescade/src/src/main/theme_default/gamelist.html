<div data-riescade-view="gamelist">
  <link rel="stylesheet" href="./assets/css/global.css" />
  <link rel="stylesheet" href="./assets/css/gamelist.css" />

  <!-- Camadas de Fundo -->
  <div class="gamelist-bg-layer">
    <div class="gamelist-bg-layer gamelist-bg-default" style="background-image: url('./assets/arts/{system:theme}.jpg')"></div>
    <img class="gamelist-bg-layer gamelist-bg-fanart" src="{game:fanart}" data-riescade-hide-on-error="true" />
    <div class="gamelist-bg-layer gamelist-overlay"></div>
    <div class="gamelist-bg-layer gamelist-overlay-right"></div>
    <div class="gamelist-bg-layer gamelist-overlay-bottom"></div>
  </div>

  <!-- HEADER GLOBAL -->
  <div class="riescade-header">
      <div class="header-left">
          <div class="system-name">{system:fullName}</div>
      </div>
      <div class="header-center centered">
          <riescade-clock format="HH:mm" />
      </div>
    <div class="header-right">
      <div class="user-profile">
        <span class="user-name">{global.cheevos.username ? {global.cheevos.username} : 'User'}</span>
        <img class="user-avatar" src="{global.cheevos.username ? 'https://media.retroachievements.org/UserPic/{global.cheevos.username}.png' : './assets/_parts/riescade.png'}" />
      </div>
    </div>
  </div>

  <!-- Conteúdo da Gamelist -->
  <div class="gamelist-main-content">
    <div class="gamelist-left-col">
      <div class="thumbnail-container" data-riescade-key="game">
        <img
          src="{system:isCollections ? '' : '{game:thumbnail}'}"
          class="gamelist-thumbnail"
          onerror="this.src = './assets/logos/{system:theme}.png'"
        />
      </div>

      <div class="gamelist-meta {system:isCollections ? 'hide' : ''}" data-riescade-key="game">
        <h2 class="gamelist-meta-title">{game:name}</h2>
        <div class="gamelist-meta-info">{game:releasedate ? '{game:releasedate:Y},' : ''} {game:developer ? '{game:developer}' : ''}</div>
      </div>
    </div>

    <div class="gamelist-right-col">
      <riescade-game-carousel
        direction="vertical"
        media-source="marquee"
        items-count="11"
        logo-scale="0.6"
        logo-selected-scale="1.5"
      ></riescade-game-carousel>
    </div>
  </div>

  <!-- FOOTER GLOBAL -->
  <div class="riescade-footer">
    <div class="system-meta">
        <span class="system-meta-name">
            {system:theme}
            <span class="system-meta-hardware">[{system:hardwareType}]</span>
        </span>
    </div>

    <!-- Helpsystem Customizado -->
    <div class="helpsystem centered">
        <img src="./assets/_parts/helpsystem/gamelist-{options:controller}.png" class="helpsystem-image" />
    </div>

    <div class="controller-activity">
        <img src="./assets/indicators/{options:controller}.svg" class="controller-activity-icon" />
    </div>
  </div>

  <div class="{system:gamecount == '0' ? 'gamelist-empty' : 'hide'}">
    <p>Não temos jogos neste sistema.</p>
  </div>"
  
</div>
