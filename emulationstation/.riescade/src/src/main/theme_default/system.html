<div data-riescade-view="system" style="--theme-color: {options:colors}">
  <link rel="stylesheet" href="./assets/css/global.css" />
  <link rel="stylesheet" href="./assets/css/system.css" />

  <!-- Camada de Fundo -->
  <div class="system-background" style="background-image: url('./assets/arts/{system:theme}.jpg')">
    <div class="system-background-overlay"></div>
  </div>

  <!-- HEADER GLOBAL -->
<div class="riescade-header">
    <div class="header-left">
        <div class="system-name">
            {system:fullName}
            <span>({system:gamecount})</span>
        </div>
    </div>
    <div class="header-center centered">
        <riescade-clock format="HH:mm" />
    </div>
    <div class="header-right"></div>
</div>


  <!-- Camada Principal: Carousel -->
  <div class="riescade-carousel-area">
    <riescade-system-carousel
      type="horizontal"
      items-count="5"
      media-source="./assets/logos"
      class="main-system-carousel"
      logo-scale="0.5"
      logo-selected-scale="1.2"
    ></riescade-system-carousel>
  </div>

  <!-- FOOTER GLOBAL -->
  <div class="riescade-footer">
    <div class="system-meta">
        <span class="system-meta-name">
            {system:theme}
            <span class="system-meta-hardware">[{system:hardwareType}]</span>
        </span>
    </div>

    <!-- Helpsystem Customizado -->
    <div class="helpsystem centered">
        <img src="./assets/_parts/helpsystem/system-ps4.png" class="helpsystem-image" />
    </div>

    <div class="controller-activity">
        <img src="./assets/indicators/ps4.svg" class="controller-activity-icon" />
    </div>
  </div>

</div>
