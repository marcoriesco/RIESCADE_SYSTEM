<div data-riescade-view="gamelist" style="--theme-color: {options:colors};">
  <link rel="stylesheet" href="./assets/css/global.css" />
  <link rel="stylesheet" href="./assets/css/gamelist.css" />

  <!-- Camadas de Fundo -->
  <div class="gamelist-bg-layer gamelist-bg-default"></div>
  <img class="gamelist-bg-layer gamelist-fanart" src="{game:fanart}" onerror="this.src = '{game:image}'" />
  <div class="gamelist-bg-layer gamelist-overlay"></div>

  <!-- Camada Principal -->
  <div class="gamelist-ui">
    
    <!-- HEADER GLOBAL -->
<div class="riescade-header">
    <div class="header-left">
        <div class="system-name">
            {system:fullName}
            <span>({system:gamecount})</span>
        </div>
    </div>
    <div class="header-center centered">
        <riescade-clock format="HH:mm" />
    </div>
    <div class="header-right"></div>
</div>


    <!-- Conteúdo da Gamelist -->
    <div class="gamelist-main-content">
      <div class="gamelist-left-col">
        <div class="thumbnail-container">
          <img src="{game:thumbnail}" class="gamelist-thumbnail" onerror="this.src = './assets/logos/{system:theme}.png'" />
        </div>

        <div class="gamelist-game-info">
          <h2 class="gamelist-game-title">{game:name}</h2>
          <div class="gamelist-game-meta">
            {game:releasedate:d/m/Y}, {game:developer}
          </div>
        </div>
      </div>

      <div class="gamelist-right-col">
        <riescade-game-carousel
          direction="vertical"
          media-source="marquee"
          items-count="11"
          logo-scale="0.6"
          logo-selected-scale="1.5"
        ></riescade-game-carousel>
      </div>
    </div>

    <!-- FOOTER GLOBAL -->
<div class="riescade-footer">
    <div class="system-meta">
        <span class="system-meta-name">
            {system:theme}
            <span class="system-meta-hardware">[{system:hardwareType}]</span>
        </span>
    </div>

    <!-- Helpsystem Customizado -->
    <div class="helpsystem centered">
        <img src="./assets/_parts/helpsystem/system-ps4.png" class="helpsystem-image" />
    </div>

    <div class="controller-activity">
        <img src="./assets/indicators/ps4.svg" class="controller-activity-icon" />
    </div>
</div>

  </div>
</div>
