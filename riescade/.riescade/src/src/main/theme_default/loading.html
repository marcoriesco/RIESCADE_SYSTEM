<div class="loading-screen-root">
  <link rel="stylesheet" href="./assets/css/loading.css" />

  <img class="loading-bg" src="{game:fanart}" onerror="this.style.display='none';" />
  
  <div class="loading-overlay"></div>

  <div class="loading-content">
    <div class="game-logo-container">
      <img src="{game:marquee}" onerror="this.style.display='none';" />
    </div>

    <h1 class="loading-title">{game:name}</h1>
  </div>

  <div class="loading-text-row" keepLoadingElement>
    <span class="loading-text" keepLoadingElementText="{t:RETURNING}">{t:LOADING}</span>
    <span class="loading-dots">...</span>
  </div>

  <div class="loading-spinner-container" keepLoadingElement>
    <svg class="loading-icon" width="256" height="256" viewBox="0 0 256 256" fill="none">
      <defs>
        <linearGradient id="grad" x1="40" y1="40" x2="216" y2="216" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="var(--theme-color)"/>
          <stop offset="100%" stop-color="color-mix(in srgb, var(--theme-color) 30%, black)"/>
        </linearGradient>
      </defs>

      <!-- Shadow / depth -->
      <circle cx="128" cy="128" r="84" stroke="color-mix(in srgb, var(--theme-color) 15%, black)" stroke-width="24" stroke-linecap="round" stroke-dasharray="440 120" transform="rotate(38 128 128)" opacity="0.45"/>

      <!-- Main circular loader -->
      <circle cx="128" cy="128" r="84" stroke="url(#grad)" stroke-width="24" stroke-linecap="round" stroke-dasharray="440 120" transform="rotate(38 128 128)"/>
    </svg>
  </div>
</div>
