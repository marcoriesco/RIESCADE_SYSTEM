    <game system="neogeo">
      <path>./DoubleDragonONE.zip</path>
      <name>Double Dragon ONE - Beta3</name>
      <desc>In 1995 Double Dragon was released on the Neo Geo. It was one of the very last titles by the legendary company, Technos Japan, and an excellent Fighting Game - but not the beat 'em up many fans expected, and have been waiting for ever since.&#13;
&#13;
30 years later, Double Dragon One aims to fill this gap. It uses the amazing sprites drawn traditionally by the artists at Brizo Interactive (a studio composed of former Brezzasoft and SNK employees) for the iOS version of the game released in 2011, and sets them on classic 1980s and 1990s arcade beat 'em up stages, to offer players an experience that looks as close as possible to what a Double Dragon could have been if Technos Japan and SNK had collaborated on such a project for the Neo Geo back in the day.&#13;
&#13;
The development of Double Dragon One is now complete, and we're inviting you to download the full game from this page. A tribute to the classic by Technos Japan, it features the same 4 Stages (the slums, the factory, the forest, and the enemy base), the last three of them split into 2 parts. An entire run represents about 25 minutes of savage brawling, during which Billy and Jimmy Lee face the most emblematic Black Warriors of the series, and of its first episode in particular, with the wide range of martial art moves that made them the legends they are. Of course, they can also pick up the weapons (knives, bats, whip, drum and dynamite) they will find on their way to the iconic final stage, the infamous warlord Willy, and the liberation of the beautiful Marian. &#13;
&#13;
The gameplay aims to stay true to the original spirit of the series, with the additional flexibility offered by the 4 buttons of the Neo Geo - this is not meant to play like Streets of Rage or Final Fight. &#13;
&#13;
Support the project: https://ozzyouzo.itch.io/double-dragon</desc>
