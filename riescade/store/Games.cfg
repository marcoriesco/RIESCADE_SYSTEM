      <desc>Released in 2011 by Eiji Hashimoto (aka “Buster”, the same name as his debut 1995 Sharp X68000 title), a longtime Japanese indie developer, Hydra Castle Labyrinth (or Meikyuujou Hydra in Japanese) is another game inspired by Konami’s perplexing adventure that’s worthy of recognition despite its absence from modern storefronts. The game gained attention when Let’s Player Deceased Crab did videos on it, inspiring Reddit user Gary the Krampus to translate the game into English. Hydra Castle Labyrinth is unremarkable by today’s standards on a surface level – a Metroidvania with retro graphics and ideas similar to classic 8-bit video games like Castlevania and The Legend of Zelda? Sounds like something you can find by the truckload on Steam! Look past that, though, and you’ll find a game that accomplishes a specific mission with aplomb: taking the smart game design and exploratory thrills of Maze of Galious and making it all palpable to modern audiences through quality of life tweaks and fewer mechanics to disrupt the pacing.&#13;
