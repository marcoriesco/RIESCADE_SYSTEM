    <game system="msx1">
      <path>./Bomb_n_blast.rom</path>
      <name>Bomb'n blast</name>
      <desc>A random sequence of shapes falls down the playing field. The objective of the game is to manipulate these shapes, by moving each one sideways and rotating it by 90 degree units, with the aim of creating a horizontal line of blocks without gaps.&#13;
When such a line is created with at least a bomb in it, it explodes and destroys surrounding bricks, and any brick above the deleted lines will fall. The more bombs you get in your lines, the bigger the explosion is by chain reaction.&#13;
As the game progresses, each level causes the shapes to fall faster, and the game ends when the stack of shapes reaches the top of the playing field and no new shape is able to enter or when you succeed in clearing the 25 levels.</desc>
