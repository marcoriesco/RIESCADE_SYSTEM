      <desc>It was a day that the members of the Viking village looked forward to every year. On this day everyone in the village celebrated the fall harvest with contests of bravery and skill throughout the afternoon followed by a grand feast at dusk.&#13;
&#13;
The most anticipated event of the day was the hunt. In this competition, the best huntsmen from the village venture into the wilderness to see who could catch the most game for the evening's feast. By noon, all the participants had arrived at the  starting point of the hunt, except for three Vikings who lived just outside the village. Since their tardiness was nothing new, the decision was made to start the hunt without them. Upon hearing the horn, indicating the beginning of the competition, Olaf the Stout and his two buddies, Baleog the Fierce and Erik the Swift simply rushed into the forest to prevent the others from having too great of a head start.&#13;
&#13;
Meanwhile, the infamous intergalactic zookeeper, Tomator, piloted his space craft to Earth through a fiery vortex that appeared high above the fjords of the Baltic Sea. Tomator was sure that he could find adequate specimens for his zoo on this tiny planet. He commanded his ship to begin its descent as he made preparations to go on a hunt of his own.&#13;
&#13;
As Olaf the Stout, Baleog the Fierce and Erik the Swift walked home from the feast they were still bragging over their triumphs in the hunt. When each brother had finished claiming that he was a better hunter than the other two, they retired to their cottages, oblivious to the strange flying object that had appeared directly over their village.&#13;
&#13;
Tomator brought his craft closer to the ground, trying to locate the three specimens that he had previously chosen. He had noticed them earlier, when they appeared to be the victors of some primitive ritual of skill and strength. After a few minutes, Tomator's computer located the selected humans and began to teleport his unsuspecting captives aboard his ship.&#13;
&#13;
Erik, the swiftest of the Vikings, was awakened suddenly to find himself suspended above his bed and being pulled upward. Despite his efforts to resist, he was drawn through the top of his hut and into the night sky. Next, Olaf the Stout and Baleog the Fierce experienced the same fate as they too were pulled from their beds, toward the strange metallic object in the sky.&#13;
&#13;
With the acquisition complete, Tomator took his craft out of orbit. Due to a short circuit during the teleportation process, the Vikings materialized in the corridors of Tomator's ship rather than in his specimen room. Now the Vikings only hope to return home is the use of their skills and the strange vortices that can carry them through time and space.&#13;
&#13;
Your story begins with the three Lost Vikings aboard Tomator's ship, and only with your help and expertise can they find their way back home again.&#13;
&#13;
You must guide the Lost Vikings through the complex maze of Tomator's space craft. Use Erik's speed, Baleog's weaponry and Olaf''s defensive abilities to help return these poor lost souls to their village.</desc>
